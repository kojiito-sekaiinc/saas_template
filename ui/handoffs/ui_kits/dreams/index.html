<!-- @dsCard group="Dreams App" viewport="1200x760" name="Sekai Dreams — interactive UI kit" subtitle="Dream list, detail, add/edit, share-to-X" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sekai Dreams</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: var(--color-bg); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="Modals.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  function App() {
    const { AppShell, DreamGrid, DreamDetail, DreamForm, ShareModal } = window;
    const [dreams, setDreams] = useState(window.DREAMS);
    const [nav, setNav] = useState("dreams");
    const [view, setView] = useState({ name: "grid" });   // grid | detail | form
    const [share, setShare] = useState(null);

    const openDetail = (d) => setView({ name: "detail", dream: d });
    const openForm = (d) => setView({ name: "form", dream: d || null });
    const backToGrid = () => setView({ name: "grid" });

    const saveDream = (data) => {
      if (view.dream) {
        setDreams((ds) => ds.map((d) => (d.id === view.dream.id ? { ...d, ...data } : d)));
      } else {
        setDreams((ds) => [{ id: Date.now(), n: ds.length + 1, ...data }, ...ds]);
      }
      backToGrid();
    };

    let content;
    if (view.name === "detail") {
      content = <DreamDetail dream={view.dream} onBack={backToGrid} onShare={setShare} onEdit={() => openForm(view.dream)} />;
    } else if (view.name === "form") {
      content = <DreamForm dream={view.dream} onCancel={view.dream ? () => openDetail(view.dream) : backToGrid} onSave={saveDream} />;
    } else {
      content = <DreamGrid dreams={dreams} filter={nav === "settings" ? "dreams" : nav}
        onOpen={openDetail} onShare={setShare} onAdd={() => openForm(null)} onFilterChange={setNav} />;
    }

    return (
      <React.Fragment>
        <AppShell active={nav} onNav={(k) => { setNav(k); backToGrid(); }} onAdd={() => openForm(null)}>
          {content}
        </AppShell>
        {share ? <ShareModal dream={share} onClose={() => setShare(null)} /> : null}
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

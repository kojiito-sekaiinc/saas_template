<!-- @dsCard group="Colors" viewport="700x150" name="Primary & accent" subtitle="Single blue accent — used sparingly" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--color-bg); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 110px; height: 56px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
  .n { font: 500 12px/1.4 var(--font-sans); color: var(--color-text); }
  .v { font: 400 11px/1.4 var(--font-mono); color: var(--color-text-subtle); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><span class="n">primary</span><span class="v">#2F6FEB</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-primary-hover)"></div><span class="n">primary-hover</span><span class="v">#1D4ED8</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-primary-subtle)"></div><span class="n">primary-subtle</span><span class="v">#EEF4FF</span></div>
</div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x250" name="Type scale" subtitle="Title → caption — hierarchy by size, not decoration" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 130px; flex-shrink: 0; font: 400 11px/1.4 var(--font-mono); color: var(--color-text-subtle); }
  .spec { color: var(--color-text); }
</style>
</head>
<body>
<div class="stack">
  <div class="line"><span class="meta">xl · 24 · 600</span><span class="spec" style="font:600 24px/1.3 var(--font-sans)">夢を、現実に。</span></div>
  <div class="line"><span class="meta">lg · 20 · 600</span><span class="spec" style="font:600 20px/1.3 var(--font-sans)">100の夢リスト</span></div>
  <div class="line"><span class="meta">md · 16 · 400</span><span class="spec" style="font:400 16px/1.6 var(--font-sans)">あなたが人生で叶えたい夢を、ひとつずつ。</span></div>
  <div class="line"><span class="meta">sm · 14 · 400</span><span class="spec" style="font:400 14px/1.4 var(--font-sans)">最近追加した夢 · 進捗順に並び替え</span></div>
  <div class="line"><span class="meta">xs · 12 · 500</span><span class="spec" style="font:500 12px/1.4 var(--font-sans); color:var(--color-text-muted)">2分前に更新</span></div>
</div>
</body>
</html>

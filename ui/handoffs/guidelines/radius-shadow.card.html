<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & shadow" subtitle="6/8/10px radii · shadow is minimal, almost never used" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 88px; height: 56px; background: var(--color-surface); border: 1px solid var(--color-border); }
  .n { font: 500 12px/1.4 var(--font-sans); color: var(--color-text); }
  .v { font: 400 10px/1.4 var(--font-mono); color: var(--color-text-subtle); }
</style>
</head>
<body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">radius-sm</span><span class="v">6px</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">radius-md</span><span class="v">8px</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">radius-lg</span><span class="v">10px</span></div>
  <div class="col" style="margin-left:24px"><div class="box" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-sm)"></div><span class="n">shadow-sm</span><span class="v">0 1px 2px /04</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">shadow-none</span><span class="v">default</span></div>
</div>
</body>
</html>

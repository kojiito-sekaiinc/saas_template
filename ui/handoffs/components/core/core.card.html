<link rel="stylesheet" href="../../styles.css" />
<style>

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel">
  const { Button, Card, Badge, Avatar } = window.SekaiDesignSystem_2572f3;
  function Demo() {
    return (
      <div>
        <div className="row">
          <span className="label">Button — variants</span>
          <Button variant="primary">夢を保存</Button>
          <Button variant="secondary">キャンセル</Button>
          <Button variant="ghost">すべて表示</Button>

          <Badge tone="warning">期限間近</Badge>
          <Badge tone="danger">中止</Badge>

          <span className="label">Avatar &nbsp;·&nbsp; Card</span>

          <Avatar name="Koji Ito" size="md" />
          <Avatar name="Koji Ito" size="lg" />

            <span style={{ fontSize: 14, color: "var(--color-text-muted)" }}>すべて正常に稼働中</span>

      </div>

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 620px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Textarea, Select } = window.SekaiDesignSystem_2572f3;
  function Demo() {
    return (
      <div className="grid">
        <Input label="夢のタイトル" defaultValue="オーロラを見る" />
        <Select label="並び替え" defaultValue="recent"
          options={[{value:"recent",label:"最近追加"},{value:"progress",label:"進捗順"},{value:"title",label:"タイトル順"}]} />
        <Input label="メールアドレス" type="email" defaultValue="me@" error="正しい形式で入力してください" />
        <Input label="リンク" hint="X で共有する公開URL" defaultValue="sekai.app/d/aurora" />
        <div style={{ gridColumn: "1 / 3" }}>
          <Textarea label="夢の概要" maxLength={120} rows={3}
            defaultValue="アイスランドかノルウェーで、冬の夜空を埋めるオーロラを自分の目で見る。" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

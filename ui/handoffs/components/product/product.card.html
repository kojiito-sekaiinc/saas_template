<head>

<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); }

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { DreamCard } = window.SekaiDesignSystem_2572f3;
  const u = (id) => `https://picsum.photos/seed/${id}/400/300`;
  function Demo() {
    return (
      <div className="grid">
        <DreamCard index={7} title="オーロラを見る" status="active"
          description="冬の夜空を埋めるオーロラを自分の目で見る。アイスランドかノルウェーで。"

          images={[u("run1")]} />

          description="いつか自分の言葉で、一冊の本を書き上げたい。" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>

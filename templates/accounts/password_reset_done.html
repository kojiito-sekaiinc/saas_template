{% extends "base.html" %}

{% block title %}Email Sent - {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Check Your Email</h1>

    <p>
        If an account exists with the email you entered, we've sent a link to
        reset your password. Please check your inbox (and spam folder).
    </p>

    <p class="auth-link"><a href="{% url 'accounts:login' %}">Back to log in</a></p>
</div>
{% endblock %}

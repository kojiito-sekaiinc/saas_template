<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaS Template{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="nav-brand">SaaS Template</a>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'app:dashboard' %}">App</a></li>
                <li><a href="{% url 'billing:pricing' %}">Pricing</a></li>
                {% if user.is_authenticated %}
                <li><a href="{% url 'accounts:logout' %}">Log out</a></li>
                {% else %}
                <li><a href="{% url 'accounts:login' %}">Log in</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2025 SaaS Template</p>
    </footer>
</body>
</html>

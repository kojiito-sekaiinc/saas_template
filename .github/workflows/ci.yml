name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ソース取得
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: テスト実行
        # config.settings_test がダミー値を補うため、env vars の設定は不要
        # pytest.ini の testpaths=apps により tests/e2e は収集されない（e2e ジョブで実行）
        run: pytest

      - name: デプロイ設定チェック
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ALLOWED_HOSTS: "example.com"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: python manage.py check_deploy_config --fail-on-warning

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: ソース取得
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        run: playwright install --with-deps chromium

      - name: E2E テスト実行
        # サーバは pytest-django の live_server フィクスチャが起動する
        run: pytest tests/e2e